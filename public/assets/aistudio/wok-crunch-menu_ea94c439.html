<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wok Crunch Oriental · Menú</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Figtree:wght@400;500;700&display=swap">
<style>
:root{
  --bg:#EEF2EA;--surface:#FFFFFF;--ink:#1F2A26;--muted:#5E6B64;--line:#D5DCCF;
  --red:#C8321E;--red-ink:#FFFFFF;--sesame:#F2B63D;--soy:#5A3B2A;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#14201B;--surface:#1D2B25;--ink:#EDF1E9;--muted:#A3B2A9;--line:#2F4037;
  --red:#E4553F;--red-ink:#1A0D09;--sesame:#F2B63D;--soy:#E3C3AE;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#14201B;--surface:#1D2B25;--ink:#EDF1E9;--muted:#A3B2A9;--line:#2F4037;--red:#E4553F;--red-ink:#1A0D09;--sesame:#F2B63D;--soy:#E3C3AE;color-scheme:dark}
html{height:100%;scroll-padding-top:calc(env(safe-area-inset-top,0px) + 64px);scroll-behavior:smooth}
*{box-sizing:border-box}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:400 16px/1.45 Figtree,system-ui,-apple-system,Segoe UI,sans-serif;padding-bottom:110px}
.wrap{max-width:640px;margin:0 auto;padding:0 16px}
header{padding:28px 0 18px}
h1{font:800 clamp(2.1rem,9vw,3.2rem)/.95 "Bricolage Grotesque",Figtree,system-ui,sans-serif;margin:0 0 8px;letter-spacing:-.02em}
h1 span{color:var(--red)}
.tag{margin:0;color:var(--muted)}
.info{margin-top:14px;display:inline-block;background:var(--sesame);color:#2A1E05;border-radius:999px;padding:6px 14px;font-weight:700;font-size:.9rem}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--bg);border-bottom:1px solid var(--line)}
nav .wrap{display:flex;gap:8px;overflow-x:auto;padding-top:10px;padding-bottom:10px;scrollbar-width:none}
nav a{flex:none;text-decoration:none;color:var(--ink);border:1.5px solid var(--line);background:var(--surface);padding:7px 14px;border-radius:999px;font-weight:500;font-size:.92rem}
nav a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--sesame);outline-offset:2px}
section{padding-top:26px}
h2{font:800 1.5rem/1.1 "Bricolage Grotesque",Figtree,sans-serif;margin:0 0 10px}
.item{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px dashed var(--line)}
.item:last-child{border-bottom:0}
.item .n{flex:1;min-width:0}
.item .n b{display:block;font-weight:700}
.item .n i{font-style:normal;color:var(--soy);font-weight:500}
.step{display:flex;align-items:center;gap:2px;background:var(--surface);border:1.5px solid var(--line);border-radius:999px;padding:2px}
.step button{width:38px;height:38px;border:0;border-radius:50%;background:transparent;color:var(--ink);font:700 1.3rem/1 Figtree,sans-serif;cursor:pointer}
.step button.add{background:var(--red);color:var(--red-ink)}
.step output{min-width:24px;text-align:center;font-weight:700}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));background:var(--bg);border-top:1px solid var(--line)}
.bar button{display:flex;width:100%;max-width:640px;margin:0 auto;justify-content:space-between;align-items:center;border:0;border-radius:14px;background:var(--red);color:var(--red-ink);font:700 1.05rem Figtree,sans-serif;padding:15px 18px;cursor:pointer}
.bar button:disabled{background:var(--line);color:var(--muted);cursor:default}
.sheet{position:fixed;inset:0;z-index:30;background:rgba(10,16,13,.6);display:none;align-items:flex-end;justify-content:center}
.sheet.open{display:flex}
.panel{background:var(--bg);width:100%;max-width:640px;max-height:92%;overflow:auto;border-radius:20px 20px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom,0px))}
.panel h3{font:800 1.4rem "Bricolage Grotesque",Figtree,sans-serif;margin:0 0 8px;display:flex;justify-content:space-between;align-items:center}
.x{border:0;background:var(--surface);color:var(--ink);width:36px;height:36px;border-radius:50%;font-size:1.1rem;cursor:pointer}
.line{display:flex;justify-content:space-between;gap:12px;padding:6px 0}
.total{display:flex;justify-content:space-between;font-weight:800;font-size:1.15rem;border-top:2px solid var(--ink);margin-top:8px;padding-top:10px}
label{display:block;font-weight:700;margin:14px 0 6px;font-size:.95rem}
input,select,textarea{width:100%;font:inherit;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:11px 12px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg label{margin:0;font-weight:500;border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:11px;text-align:center;cursor:pointer}
.seg input{position:absolute;opacity:0;width:0}
.seg input:checked+span{font-weight:700}
.seg label:has(input:checked){border-color:var(--red);box-shadow:inset 0 0 0 1.5px var(--red)}
.loc{margin-top:8px;background:transparent;border:1.5px dashed var(--line);color:var(--ink);border-radius:10px;padding:9px 12px;font:inherit;cursor:pointer;width:100%}
.send{margin-top:20px;width:100%;border:0;border-radius:14px;background:#1FA855;color:#fff;font:700 1.05rem Figtree,sans-serif;padding:15px;cursor:pointer}
.err{color:var(--red);font-weight:700;margin:10px 0 0;min-height:1.2em}
.hide{display:none}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
</style>
</head>
<body>
<header><div class="wrap">
  <h1>Wok Crunch <span>Oriental</span></h1>
  <p class="tag">Sabor oriental en cada bocado</p>
  <span class="info">Delivery y retiro · Armá tu pedido y envialo por WhatsApp</span>
</div></header>
<nav><div class="wrap" id="chips"></div></nav>
<main class="wrap" id="menu"></main>

<div class="bar"><button id="open" disabled><span id="cnt">Tu pedido está vacío</span><span id="tot"></span></button></div>

<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Tu pedido">
<div class="panel">
  <h3>Tu pedido <button class="x" id="close" aria-label="Cerrar">✕</button></h3>
  <div id="lines"></div>
  <div class="total"><span>Total</span><span id="sum"></span></div>

  <label for="name">Nombre</label>
  <input id="name" autocomplete="name" placeholder="Tu nombre">

  <label>Tipo de entrega</label>
  <div class="seg">
    <label><input type="radio" name="tipo" value="Delivery" checked><span>🛵 Delivery</span></label>
    <label><input type="radio" name="tipo" value="Retiro"><span>🏪 Retiro</span></label>
  </div>

  <div id="addrBox">
    <label for="addr">Dirección / ubicación</label>
    <textarea id="addr" rows="2" placeholder="Calle, número, referencia"></textarea>
    <button class="loc" id="loc" type="button">📍 Agregar mi ubicación actual</button>
  </div>

  <label for="pay">Forma de pago</label>
  <select id="pay"><option>Efectivo</option><option>Transferencia</option></select>

  <label for="obs">Observaciones (opcional)</label>
  <input id="obs" placeholder="Ej: sin cebolla">

  <p class="err" id="err" role="alert"></p>
  <button class="send" id="send">Enviar pedido por WhatsApp</button>
</div>
</div>

<script>
// Número de WhatsApp del negocio, con código de país y sin signos. Ej: "595981123456".
// Si queda vacío, WhatsApp abre y deja elegir el contacto.
var WHATSAPP = "595991607393";

var MENU = [
  {id:"arroz", t:"🍚 Arroz frito", items:[["Arroz frito de pollo",23000],["Arroz frito con carne",25000],["Arroz frito de camarón",75000]]},
  {id:"yaki", t:"🥢 Yakisoba", items:[["Yakisoba de pollo",25000],["Yakisoba de carne",28000],["Yakisoba de camarón",75000]]},
  {id:"pollo", t:"🍗 Pollo frito", items:[["Pollo frito normal",35000],["Pollo frito agridulce",40000],["Pollo frito picante",40000]]},
  {id:"papas", t:"🍟 Papas fritas", items:[["Papas fritas pequeña",15000],["Papas fritas grande",20000]]},
  {id:"burg", t:"🍔 Hamburguesas", items:[["Hamburguesa pequeña",15000],["Hamburguesa grande",25000]]}
];
var qty = {}; // clave "c-i" -> cantidad
function gs(n){return "Gs. " + String(n).replace(/\B(?=(\d{3})+(?!\d))/g,".");}
function $(id){return document.getElementById(id);}

var menuEl=$("menu"), chips=$("chips");
MENU.forEach(function(c,ci){
  var a=document.createElement("a"); a.href="#"+c.id; a.textContent=c.t; chips.appendChild(a);
  var s=document.createElement("section"); s.id=c.id;
  var h='<h2>'+c.t+'</h2>';
  c.items.forEach(function(it,ii){
    var k=ci+"-"+ii;
    h+='<div class="item"><div class="n"><b>'+it[0]+'</b><i>'+gs(it[1])+'</i></div>'+
       '<div class="step" data-k="'+k+'"><button type="button" data-d="-1" aria-label="Quitar" class="hide">−</button>'+
       '<output class="hide">0</output><button type="button" data-d="1" class="add" aria-label="Agregar">+</button></div></div>';
  });
  s.innerHTML=h; menuEl.appendChild(s);
});

menuEl.addEventListener("click",function(e){
  var b=e.target.closest("button[data-d]"); if(!b) return;
  change(b.parentNode.getAttribute("data-k"), +b.getAttribute("data-d"));
});

function change(k,d){
  qty[k]=Math.max(0,(qty[k]||0)+d);
  var st=document.querySelector('.step[data-k="'+k+'"]');
  var q=qty[k];
  st.querySelector("output").textContent=q;
  st.querySelector("output").classList.toggle("hide",q===0);
  st.querySelector('[data-d="-1"]').classList.toggle("hide",q===0);
  refresh();
}
function cart(){
  var out=[],total=0,count=0;
  MENU.forEach(function(c,ci){c.items.forEach(function(it,ii){
    var q=qty[ci+"-"+ii]||0; if(q){out.push({n:it[0],q:q,s:q*it[1]});total+=q*it[1];count+=q;}
  });});
  return {lines:out,total:total,count:count};
}
function refresh(){
  var c=cart();
  $("open").disabled=c.count===0;
  $("cnt").textContent=c.count?("Ver pedido ("+c.count+(c.count===1?" ítem)":" ítems)")):"Tu pedido está vacío";
  $("tot").textContent=c.count?gs(c.total):"";
  if($("sheet").classList.contains("open")) renderLines();
}
function renderLines(){
  var c=cart();
  $("lines").innerHTML=c.lines.map(function(l){return '<div class="line"><span>'+l.q+' × '+l.n+'</span><b>'+gs(l.s)+'</b></div>';}).join("");
  $("sum").textContent=gs(c.total);
  if(!c.count) closeSheet();
}
function openSheet(){renderLines();$("sheet").classList.add("open");}
function closeSheet(){$("sheet").classList.remove("open");}
$("open").onclick=openSheet; $("close").onclick=closeSheet;
$("sheet").addEventListener("click",function(e){if(e.target===this)closeSheet();});
document.addEventListener("keydown",function(e){if(e.key==="Escape")closeSheet();});

function tipo(){return document.querySelector('input[name="tipo"]:checked').value;}
document.querySelectorAll('input[name="tipo"]').forEach(function(r){
  r.onchange=function(){$("addrBox").classList.toggle("hide",tipo()==="Retiro");};
});
$("loc").onclick=function(){
  var btn=this;
  if(!navigator.geolocation){$("err").textContent="Tu navegador no permite obtener la ubicación.";return;}
  btn.textContent="Buscando ubicación…";
  navigator.geolocation.getCurrentPosition(function(p){
    var link="https://maps.google.com/?q="+p.coords.latitude.toFixed(6)+","+p.coords.longitude.toFixed(6);
    $("addr").value=($("addr").value?$("addr").value+"\n":"")+link;
    btn.textContent="📍 Ubicación agregada"; $("err").textContent="";
  },function(){btn.textContent="📍 Agregar mi ubicación actual";$("err").textContent="No pudimos obtener tu ubicación. Escribí la dirección.";});
};

$("send").onclick=function(){
  var c=cart(), name=$("name").value.trim(), t=tipo(), addr=$("addr").value.trim();
  if(!c.count){$("err").textContent="Agregá al menos un plato.";return;}
  if(!name){$("err").textContent="Escribí tu nombre.";$("name").focus();return;}
  if(t==="Delivery"&&!addr){$("err").textContent="Escribí la dirección o agregá tu ubicación.";$("addr").focus();return;}
  $("err").textContent="";
  var m="🥢 *NUEVO PEDIDO · WOK CRUNCH ORIENTAL*\n\n1️⃣ *Pedido:*\n";
  c.lines.forEach(function(l){m+="• "+l.q+" × "+l.n+" — "+gs(l.s)+"\n";});
  m+="\n💰 *Total:* "+gs(c.total)+"\n2️⃣ *Nombre:* "+name+"\n3️⃣ *Entrega:* "+t+"\n";
  if(t==="Delivery") m+="4️⃣ *Dirección:* "+addr+"\n";
  m+="5️⃣ *Pago:* "+$("pay").value;
  var o=$("obs").value.trim(); if(o) m+="\n📝 *Obs.:* "+o;
  var url="https://wa.me/"+WHATSAPP+"?text="+encodeURIComponent(m);
  window.open(url,"_blank");
};
</script>
</body>
</html>
